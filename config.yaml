ai_engine:
  capture_size: 416
  confidence: 0.45
  enabled: true
  execution_provider: auto
  headshot_bias: 0.40
  iou_threshold: 0.45
  model_path: ./models/v11n-416-2.onnx  # yolo11n: ~3.1ms vs ~7.9ms di yolov8m su NPU (misurato)
  target_classes:
  - 0  # ATTENZIONE: v11n = {0: enemy, 1: ally}; yolov8m = {1: enemy}. Cambiando modello, riallineare!
aim:

  deadzone_px: 2.0
  enable: true
  fov_radius_px: 100.0
  pre_multiplier_x: 1.0
  pre_multiplier_y: 1.0
  trace_algorithm: 0
  trace_delay_ms: 0
  cx_counts_per_2pi: 1657.8639905405767  # calibrated by tools/calibrate_cx.py
  lock_radius_px: 120.0
  lock_timeout_s: 1.0
  ema_alpha: 0.22 # base gain. La latenza di feedback L~5 frame è dominata dalla capture card (NON dall'inferenza), quindi cambiare modello non sposta g_crit≈0.285. 0.22 resta sotto soglia anche in ADS (0.22/0.8=0.275<0.285). Non superare ~0.22 finché ads_multiplier non è verificato.
  setpoint_smoothing: true             # One Euro sulla posizione-testa del target (riduce jitter detector ~50%, setpoint-side: non causa orbiting)
  setpoint_smoothing_min_cutoff: 3.0   # Hz; più alto = meno lag, meno smoothing
  setpoint_smoothing_beta: 0.10        # quanto il cutoff si apre con la velocità (più alto = segue meglio i target veloci)
  disable_prediction: true
  prediction_interval: 1.2
  autofire_enabled: false
  autofire_tolerance_px: 10.0
  autofire_cooldown_s: 0.20

  ads_multiplier: 0.8  # ratio = ADS_sens / hipfire_sens = 0.4 / 0.5
capture:
  backend: capture_card
  chipset_preset: ms2130
  device_index: 0
  fourcc: YUY2
  fps_cap: 60
  monitor: 0
  resolution_height: 1080
  resolution_width: 1920
general:
  activation_key: mouse_side1
  architecture: dual_pc
  log_file: errors.log
  log_level: WARNING
  mode: aimbot
  overlay: false
  panic_key: f10
  primary_engine: ai
input:
  driver: kmbox_net
  kmbox_net:
    ip: 192.168.2.188
    port: '41990'
    use_encryption: true
    uuid: B6860C3D
rapid_fire:
  enabled: false
  target_cps: 10
